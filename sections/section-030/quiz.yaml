provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: "Admission Controllers"
questions:
  - id: ats007-030-q01
    type: single_choice
    difficulty: beginner
    learning_objective: Name the stage where an object can still be rewritten
    source_readings:
    - sections/section-030/module-01/course-01-api-request-lifecycle-and-webhook-types.md
    prompt: A client submits a request to create a Pod. At which stage of the API request lifecycle can the object's contents still legally be rewritten?
    options:
    - id: a
      text: Validating admission
      explanation: Validating webhooks may only allow or deny — they cannot patch the object.
    - id: b
      text: Object schema validation
      explanation: Schema validation only checks the object against the OpenAPI schema; it does not rewrite fields.
    - id: c
      text: Mutating admission
      explanation: Correct. Mutating admission is the only stage where the object may still be changed. Built-in mutating controllers and any registered `MutatingWebhookConfiguration` webhooks run here and can return a JSON patch that rewrites the object before it moves on.
    - id: d
      text: Persistence to etcd
      explanation: By the time an object reaches etcd, every admission stage has already finished.
    correct_option: c
    explanation: Mutating admission is the only stage where the object may still be changed. Built-in mutating controllers and any registered `MutatingWebhookConfiguration` webhooks run here and can return a JSON patch that rewrites the object before it moves on.

  - id: ats007-030-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain what failurePolicy Ignore does when the webhook is down
    source_readings:
    - sections/section-030/module-01/course-02-mutating-vs-validating-webhooks.md
    prompt: 'You register a `ValidatingWebhookConfiguration` with `failurePolicy: Ignore`. The webhook''s backing pods crash and become unreachable. What happens to a matching request submitted during the outage?'
    options:
    - id: a
      text: The request is rejected, since the webhook could not be reached.
      explanation: 'Describes `failurePolicy: Fail` (fail-closed), the opposite setting.'
    - id: b
      text: The request is admitted, as if the webhook had returned an "allowed" response.
      explanation: 'Correct. `failurePolicy: Ignore` is fail-open — if the webhook cannot be reached, times out, or errors, the API server treats the request as allowed rather than blocking cluster operations on a webhook outage.'
    - id: c
      text: The API server queues the request until the webhook recovers.
      explanation: The API server does not queue admission requests waiting on a webhook.
    - id: d
      text: The request is retried against a different webhook automatically.
      explanation: There is no automatic webhook failover mechanism.
    correct_option: b
    explanation: "`failurePolicy: Ignore` is fail-open — if the webhook cannot be reached, times out, or errors, the API server treats the request as allowed rather than blocking cluster operations on a webhook outage."

  - id: ats007-030-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain how Kyverno updates its own webhook for a new policy
    source_readings:
    - sections/section-030/module-01/course-02-mutating-vs-validating-webhooks.md
    prompt: You install a brand-new `ClusterPolicy` that matches only `Secret` resources for the first time in this cluster. What should you expect to observe about Kyverno's `ValidatingWebhookConfiguration` immediately afterward?
    options:
    - id: a
      text: Nothing changes — Kyverno's webhook already intercepts every resource kind by default.
      explanation: Kyverno deliberately avoids matching every kind by default to minimize API server overhead.
    - id: b
      text: A new rule entry for `secrets` appears in Kyverno's managed webhook configuration.
      explanation: Correct. Kyverno continuously reconciles its own webhook `rules` to be the union of resource kinds referenced by currently installed policies. A policy newly matching `Secret` causes a `secrets` rule entry to be added to the existing webhook object.
    - id: c
      text: Kyverno creates an entirely new `ValidatingWebhookConfiguration` object just for this policy.
      explanation: Kyverno manages one webhook object of each type, not one per policy.
    - id: d
      text: The webhook configuration is unaffected; only `PolicyReport` objects reflect new policies.
      explanation: The webhook rule set itself changes, not just report objects.
    correct_option: b
    explanation: Kyverno continuously reconciles its own webhook `rules` to be the union of resource kinds referenced by currently installed policies. A policy newly matching `Secret` causes a `secrets` rule entry to be added to the existing webhook object.

  - id: ats007-030-q04
    type: single_choice
    difficulty: beginner
    learning_objective: Explain what Audit mode does with a failing resource
    source_readings:
    - sections/section-030/module-02/course-01-enforce-vs-audit-and-policyreports.md
    prompt: 'A `ClusterPolicy` has `validationFailureAction: Audit`. A resource is created that fails the policy''s `validate` rule. What happens?'
    options:
    - id: a
      text: The request is rejected and the client sees an admission error.
      explanation: Describes `Enforce` mode.
    - id: b
      text: The request is admitted, and the failure is recorded in a `PolicyReport` or `ClusterPolicyReport`.
      explanation: Correct. `Audit` mode never blocks the request. A rule failure is recorded as a `fail` result in a `PolicyReport`/`ClusterPolicyReport`, letting you observe what a policy would have blocked without any enforcement actually happening.
    - id: c
      text: The resource is admitted but automatically deleted a few seconds later.
      explanation: Audit mode has no deletion behavior.
    - id: d
      text: Kyverno automatically mutates the resource to make it compliant.
      explanation: "`validate` rules never mutate; that is a separate rule type (`mutate`)."
    correct_option: b
    explanation: "`Audit` mode never blocks the request. A rule failure is recorded as a `fail` result in a `PolicyReport`/`ClusterPolicyReport`, letting you observe what a policy would have blocked without any enforcement actually happening."

  - id: ats007-030-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain how existing resources reach a report
    source_readings:
    - sections/section-030/module-02/course-02-background-scanning-and-controllers.md
    prompt: 'A Deployment has existed in the cluster for six months. Today, an administrator installs a new `ClusterPolicy` with `background: true` that this Deployment violates. How does Kyverno become aware of the violation?'
    options:
    - id: a
      text: It never does — admission control only evaluates resources at creation or update time.
      explanation: That is exactly the gap background scanning closes.
    - id: b
      text: The `kyverno-background-controller` performs a periodic scan of existing resources and records the result in a `PolicyReport`.
      explanation: 'Correct. `background: true` enables periodic re-evaluation of existing resources against the policy, independent of admission events, with results recorded as `PolicyReport`/`ClusterPolicyReport` entries — this is how a resource that predates a policy is still evaluated. (Note: this scan is scheduled by the `kyverno-reports-controller`, which produces and aggregates the report entries.)'
    - id: c
      text: The Deployment is automatically restarted so it re-triggers admission control.
      explanation: Nothing about background scanning restarts workloads.
    - id: d
      text: The cluster administrator must manually re-apply every existing resource.
      explanation: No manual re-apply step is required.
    correct_option: b
    explanation: "`background: true` enables periodic re-evaluation of existing resources against the policy, independent of admission events, with results recorded as `PolicyReport`/`ClusterPolicyReport` entries — this is how a resource that predates a policy is still evaluated. (Note: this scan is scheduled by the `kyverno-reports-controller`, which produces and aggregates the report entries.)"

  - id: ats007-030-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: Trace missing reports to the right controller
    source_readings:
    - sections/section-030/module-02/course-02-background-scanning-and-controllers.md
    prompt: "`PolicyReport` results for existing resources in a namespace are never being generated, even though a `background: true` policy has been installed for hours and other Kyverno enforcement (blocking new bad requests) works fine. Which controller's logs are the most useful starting point?"
    options:
    - id: a
      text: "`kyverno-admission-controller`"
      explanation: Handles real-time admission requests, which are confirmed working in this scenario.
    - id: b
      text: "`kyverno-cleanup-controller`"
      explanation: Handles scheduled TTL-based cleanup, unrelated to reports.
    - id: c
      text: "`kyverno-reports-controller`"
      explanation: Correct. `kyverno-reports-controller` is responsible for background scans and producing/aggregating `PolicyReport`/`ClusterPolicyReport` objects. Since real-time enforcement (handled by `kyverno-admission-controller`) is working fine, the fault is isolated to the reporting path.
    - id: d
      text: "`kube-apiserver`"
      explanation: Is the Kubernetes API server itself, not a Kyverno component.
    correct_option: c
    explanation: "`kyverno-reports-controller` is responsible for background scans and producing/aggregating `PolicyReport`/`ClusterPolicyReport` objects. Since real-time enforcement (handled by `kyverno-admission-controller`) is working fine, the fault is isolated to the reporting path."

  - id: ats007-030-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: Choose the settings for an immediate block
    source_readings:
    - sections/section-030/module-02/course-01-enforce-vs-audit-and-policyreports.md
    prompt: An administrator wants a policy to reject non-compliant Pods immediately once rolled out, with zero tolerance for a grace period. Which combination of settings achieves this from day one, and what is the operational risk of skipping straight to it on a cluster with existing resources?
    options:
    - id: a
      text: "`validationFailureAction: Audit`; there is no risk, since Audit mode is always safe."
      explanation: Audit mode by itself does not enforce anything, so it doesn't satisfy "reject non-compliant Pods immediately."
    - id: b
      text: "`validationFailureAction: Enforce`; the risk is that pre-existing non-compliant resources are unaffected, but any *new* matching request that violates the rule — including from an unrelated deploy pipeline — is blocked immediately, with no prior visibility into how many requests that will affect."
      explanation: Correct. `Enforce` blocks non-compliant requests starting the moment the policy is active. Skipping the Audit-first workflow means you have no prior visibility into how many currently-passing requests will suddenly start failing — the classic cause of an unplanned deploy-pipeline outage from a new policy.
    - id: c
      text: "`background: false`; this guarantees no risk because background scanning is disabled."
      explanation: "`background` only affects scanning of existing resources, not whether new requests are blocked."
    - id: d
      text: "`validationFailureAction: Enforce` combined with `background: false`; this eliminates all risk entirely."
      explanation: No combination of settings eliminates the risk of an untested Enforce rollout; it only changes what gets reported about pre-existing resources.
    correct_option: b
    explanation: "`Enforce` blocks non-compliant requests starting the moment the policy is active. Skipping the Audit-first workflow means you have no prior visibility into how many currently-passing requests will suddenly start failing — the classic cause of an unplanned deploy-pipeline outage from a new policy."

  - id: ats007-030-q08
    type: single_choice
    difficulty: beginner
    learning_objective: Tell a PolicyReport from a ClusterPolicyReport
    source_readings:
    - sections/section-030/module-02/course-01-enforce-vs-audit-and-policyreports.md
    prompt: Which statement correctly distinguishes a `PolicyReport` from a `ClusterPolicyReport`?
    options:
    - id: a
      text: "`PolicyReport` is namespaced and holds results for namespaced resources; `ClusterPolicyReport` holds results for cluster-scoped resources."
      explanation: Correct. `PolicyReport` is a namespaced resource holding results for resources within that namespace; `ClusterPolicyReport` is cluster-scoped and holds results for cluster-scoped resources (such as Namespaces or PersistentVolumes) that have no namespace of their own.
    - id: b
      text: "`PolicyReport` only records `Enforce`-mode results; `ClusterPolicyReport` only records `Audit`-mode results."
      explanation: Both object kinds can carry results from either Audit or Enforce evaluation; the split is about resource scope, not enforcement mode.
    - id: c
      text: They are two names for the exact same object with no functional difference.
      explanation: They are distinct CRDs with distinct scopes.
    - id: d
      text: "`ClusterPolicyReport` is deprecated in favor of `PolicyReport` for all resource types."
      explanation: Both remain part of the current reporting model, each serving a different resource scope.
    correct_option: a
    explanation: "`PolicyReport` is a namespaced resource holding results for resources within that namespace; `ClusterPolicyReport` is cluster-scoped and holds results for cluster-scoped resources (such as Namespaces or PersistentVolumes) that have no namespace of their own."

  - id: ats007-030-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: Set failurePolicy and read it from the webhook
    source_readings:
    - sections/section-030/module-03/course-01-failure-policy-and-timeouts.md
    prompt: 'A policy sets `failurePolicy: Ignore` and `webhookTimeoutSeconds: 20`. Where do you see the effect in the cluster?'
    options:
    - id: a
      text: In the `kyverno` ConfigMap under `resourceFilters`.
      explanation: That list is for skipped objects.
    - id: b
      text: In the validating webhook configuration, where the `-ignore` webhook has a rule for the kind and a timeout of 20.
      explanation: Correct. Kyverno sorts policies into a webhook per failure policy and sets its timeout from the policy.
    - id: c
      text: In a new `PolicyReport`.
      explanation: Reports hold results, not webhook settings.
    - id: d
      text: Nowhere. Failure policy exists only inside Kyverno's memory.
      explanation: It is written into the webhook configuration.
    correct_option: b
    explanation: Kyverno writes each policy's rules into the webhook that matches its failure policy, and sets that webhook's timeout from the policy.

  - id: ats007-030-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: Choose a failure policy for a safety rule
    source_readings:
    - sections/section-030/module-03/course-01-failure-policy-and-timeouts.md
    prompt: A rule guards a safety property, and a gap would be worse than a short outage. Which failure policy fits, and what does it do when Kyverno is down?
    options:
    - id: a
      text: "`Ignore`, which admits matching requests."
      explanation: This opens a gap exactly when Kyverno is down.
    - id: b
      text: "`Fail`, which rejects matching requests."
      explanation: Correct. `Fail` is the default and it keeps the safety property at the cost of availability.
    - id: c
      text: "`Warn`, which prints a warning."
      explanation: There is no `Warn` failure policy.
    - id: d
      text: "`Audit`, which records the request."
      explanation: "`Audit` is a value of `validationFailureAction`, not of `failurePolicy`."
    correct_option: b
    explanation: "`Fail` rejects matching requests when Kyverno cannot answer, so no unchecked object gets in."

  - id: ats007-030-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain what resource filters do
    source_readings:
    - sections/section-030/module-03/course-02-resource-filters-and-availability.md
    prompt: A policy matches the kind `Event` but never fires. What should you check first?
    options:
    - id: a
      text: The `resourceFilters` list in the `kyverno` ConfigMap, because filtered kinds never reach a policy.
      explanation: Correct. Events are usually in the default filter list, so Kyverno never checks them.
    - id: b
      text: The Pod's labels.
      explanation: The kind is not a Pod.
    - id: c
      text: The cluster's DNS settings.
      explanation: DNS is not involved.
    - id: d
      text: The `webhookTimeoutSeconds` of the policy.
      explanation: A timeout does not hide a kind.
    correct_option: a
    explanation: "`resourceFilters` lists kinds, namespaces and names that Kyverno skips, so a policy for a filtered kind never fires."

