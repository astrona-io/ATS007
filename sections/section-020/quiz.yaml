  title: "YAML Manifests"
questions:
  - id: ats007-020-q01
    type: single_choice
    difficulty: beginner
    learning_objective: Choose the right policy kind for one namespace
    source_readings:
    - sections/section-020/module-01/course-01-apiversion-kind-metadata-spec.md
    prompt: You need a policy that should only ever affect resources inside the `billing` namespace, and must never be usable to affect any other team's namespace even by accident. Which `kind` should you choose, and why?
    options:
    - id: a
      text: "`ClusterPolicy`, because it is the only kind that supports a `validate` rule."
      explanation: Both kinds support every rule type, including `validate`.
    - id: b
      text: "`Policy`, placed in the `billing` namespace, because a namespaced `Policy` can only ever see resources created in its own namespace regardless of what `match` says."
      explanation: Correct. A namespaced `Policy` object is scoped by its own `metadata.namespace` — its rules can only ever evaluate resources created in that same namespace, no matter how permissive its `match` block is written. This is the strongest guarantee against accidentally affecting another team's resources.
    - id: c
      text: "`ClusterPolicy` with a `namespaces` filter in `match`, because `Policy` objects do not support `validate` rules."
      explanation: For the same reason, and a `namespaces` filter in `match` is a convention, not an enforced boundary — a typo could widen it.
    - id: d
      text: Either kind works identically; the choice makes no functional difference.
      explanation: Scope is the entire functional difference between the two kinds.
    correct_option: b
    explanation: A namespaced `Policy` object is scoped by its own `metadata.namespace` — its rules can only ever evaluate resources created in that same namespace, no matter how permissive its `match` block is written. This is the strongest guarantee against accidentally affecting another team's resources.

  - id: ats007-020-q02
    type: single_choice
    difficulty: beginner
    learning_objective: Explain that a created policy object is not yet proof the policy works
    source_readings:
    - sections/section-020/module-01/course-02-applying-and-inspecting-with-kubectl.md
    prompt: 'You run `kubectl apply -f my-policy.yaml` and the command reports the object was created successfully. You then run `kubectl describe clusterpolicy my-policy` and see `Ready: False` with a message referencing an unknown resource kind. What does this indicate?'
    options:
    - id: a
      text: The policy is corrupted and must be deleted and recreated from scratch.
      explanation: Is overkill — fixing the referenced `kind` and re-applying is sufficient; deleting is not required.
    - id: b
      text: Kyverno accepted the object but found a validation problem with the policy's own rules — such as a `match.resources.kinds` entry that does not exist on this cluster — and never activated it.
      explanation: 'Correct. The Kubernetes API server accepting the object (schema-valid YAML) is a separate step from Kyverno validating the *policy''s own logic* is sound. A `Ready: False` condition with a message naming an unknown kind means a rule''s `match` block references a resource kind that is not registered on this cluster (commonly a typo, or a CRD that is not installed) — the policy exists but Kyverno never activates enforcement for it.'
    - id: c
      text: "`kubectl apply` silently failed despite reporting success."
      explanation: The object genuinely was created; the failure is at the policy-logic level, not the API-server level.
    - id: d
      text: 'The policy is active and enforcing; `Ready: False` only affects background scanning.'
      explanation: A policy that is not `Ready` is not enforcing at all.
    correct_option: b
    explanation: 'The Kubernetes API server accepting the object (schema-valid YAML) is a separate step from Kyverno validating the *policy''s own logic* is sound. A `Ready: False` condition with a message naming an unknown kind means a rule''s `match` block references a resource kind that is not registered on this cluster (commonly a typo, or a CRD that is not installed) — the policy exists but Kyverno never activates enforcement for it.'

  - id: ats007-020-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: Test a manifest against live policies without storing it
    source_readings:
    - sections/section-020/module-01/course-03-dry-runs-and-multi-document-files.md
    prompt: You want to test whether a `Pod` manifest would be accepted or rejected by your cluster's active Kyverno policies, without leaving behind a real Pod object to clean up afterward. Which command achieves this?
    options:
    - id: a
      text: "`kubectl apply --dry-run=client -f pod.yaml`"
      explanation: "`--dry-run=client` never leaves your machine; it never reaches Kyverno's webhook and cannot reflect any policy decision."
    - id: b
      text: "`kubectl apply --dry-run=server -f pod.yaml`"
      explanation: Correct. `--dry-run=server` sends the manifest all the way to the API server, through every admission webhook including Kyverno's, and returns the real admission decision — without persisting the object to etcd.
    - id: c
      text: "`kubectl create -f pod.yaml --validate=false`"
      explanation: "`--validate=false` disables client-side schema validation, unrelated to admission webhooks, and would still actually create the object."
    - id: d
      text: "`kyverno test pod.yaml`"
      explanation: Describes `kyverno test`, a structured local test-suite command that does not exercise the real cluster's admission path.
    correct_option: b
    explanation: "`--dry-run=server` sends the manifest all the way to the API server, through every admission webhook including Kyverno's, and returns the real admission decision — without persisting the object to etcd."

  - id: ats007-020-q04
    type: single_choice
    difficulty: beginner
    learning_objective: Separate two documents in one YAML file
    source_readings:
    - sections/section-020/module-01/course-03-dry-runs-and-multi-document-files.md
    prompt: You have two Kyverno policies you want to ship together in one file for a GitOps pipeline to apply as a unit. What must separate the two `ClusterPolicy` documents inside that single YAML file?
    options:
    - id: a
      text: A blank line.
      explanation: A blank line has no special meaning to a YAML parser; the two policies would merge into one malformed document.
    - id: b
      text: A line containing only `---`.
      explanation: Correct. A line containing only `---` is the YAML multi-document separator. `kubectl apply -f` parses each document in the file separately and applies each in order.
    - id: c
      text: A comment line starting with `#---`.
      explanation: That is just a comment, invisible to the YAML parser as a separator.
    - id: d
      text: Nothing; `kubectl apply` automatically detects document boundaries by `kind`.
      explanation: Without an explicit `---`, the file is one document, and having two top-level `kind:` keys in a single YAML mapping is a parse error, not an auto-detected split.
    correct_option: b
    explanation: A line containing only `---` is the YAML multi-document separator. `kubectl apply -f` parses each document in the file separately and applies each in order.

  - id: ats007-020-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: Write a pattern that starts at the right level of the object
    source_readings:
    - sections/section-020/module-02/course-01-variables-and-jmespath-basics.md
    prompt: |-
      You write a rule intending to require every Pod to carry a `team` label, using this pattern:
      ```yaml
      validate:
        pattern:
          labels:
            team: "?*"
      ```
      After applying it, Pods with no `team` label are still created successfully with no rejection. What is the most likely cause?
    options:
    - id: a
      text: "`?*` is invalid Kyverno pattern syntax and the whole policy failed to load."
      explanation: "`?*` (at least one of any character) is valid Kyverno pattern syntax; the described silent-pass symptom, not a load failure, is what actually happens."
    - id: b
      text: The pattern is missing the `metadata:` wrapper — no Pod has a top-level `labels` field, so the pattern matches nothing and the rule silently never fires.
      explanation: 'Correct. A `validate.pattern` block must mirror the real resource''s structure exactly, starting from its root. `labels` only exists nested under `metadata` on a Pod — a pattern missing that wrapper checks a field path that does not exist anywhere on any Pod, so it trivially "matches" everything and the rule never rejects anything. This does not error at apply time; the policy shows `Ready: True` and appears to work while doing nothing.'
    - id: c
      text: "`validationFailureAction` must be explicitly set to `Audit` for label checks to work."
      explanation: "`validationFailureAction` controls block-vs-report, not whether the pattern is evaluated at all."
    - id: d
      text: Label-based rules require a `context` entry to function.
      explanation: A static pattern check needs no `context` entry.
    correct_option: b
    explanation: 'A `validate.pattern` block must mirror the real resource''s structure exactly, starting from its root. `labels` only exists nested under `metadata` on a Pod — a pattern missing that wrapper checks a field path that does not exist anywhere on any Pod, so it trivially "matches" everything and the rule never rejects anything. This does not error at apply time; the policy shows `Ready: True` and appears to work while doing nothing.'

  - id: ats007-020-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain where a variable in a message gets its value
    source_readings:
    - sections/section-020/module-02/course-01-variables-and-jmespath-basics.md
    prompt: 'A rule''s `validate.message` is written as: `"Pod {{ request.object.metadata.name }} is missing a required label."` What determines the exact text a user sees when this rule rejects their request?'
    options:
    - id: a
      text: The message is static and always reads exactly as written in the YAML, including the literal `{{ }}` characters.
      explanation: Describes what would happen if the syntax were broken or unsupported, which it is not.
    - id: b
      text: "`{{ request.object.metadata.name }}` is a JMESPath expression resolved at evaluation time against the actual submitted resource, so the rejected user sees their own Pod's real name substituted in."
      explanation: Correct. `{{ }}` wraps a JMESPath expression evaluated against data available to the rule — here, the built-in `request.object`, present on every admission request with no extra setup. The resolved value (the actual Pod's name) replaces the `{{ }}` block in the rendered message.
    - id: c
      text: 'The message only resolves variables when `background: true` is set.'
      explanation: "`background` controls periodic re-scans of existing resources, unrelated to whether admission-time variable resolution happens."
    - id: d
      text: Variable substitution in `validate.message` requires a `context` entry even for `request.object` fields.
      explanation: "`request.object` and `request.oldObject` are always available without a `context` block; `context` is only needed for external data sources like ConfigMaps or API calls."
    correct_option: b
    explanation: "`{{ }}` wraps a JMESPath expression evaluated against data available to the rule — here, the built-in `request.object`, present on every admission request with no extra setup. The resolved value (the actual Pod's name) replaces the `{{ }}` block in the rendered message."

  - id: ats007-020-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: Read live data into a rule with a configMap context entry
    source_readings:
    - sections/section-020/module-02/course-02-context-configmap-and-apicall.md
    prompt: Your platform team wants a list of "currently allowed environment values" that application teams' policies check against, and they want to be able to update that list at any time without any application team having to re-apply their policy YAML. Which mechanism fits this requirement?
    options:
    - id: a
      text: Hardcode the list directly inside each policy's `validate.pattern`.
      explanation: Hardcoding requires editing and re-applying every policy whenever the list changes, the opposite of the requirement.
    - id: b
      text: "`context[].configMap`, pointing every relevant rule at one centrally-maintained ConfigMap."
      explanation: Correct. `context[].configMap` loads a ConfigMap's data into a rule as a variable. Updating the ConfigMap takes effect on the next admission request with no policy edit required — exactly the "change the list without touching every policy" requirement described.
    - id: c
      text: "`context[].apiCall` calling an external ticketing system on every admission request."
      explanation: Would technically work but is a needless external HTTP round-trip on every single admission request for data that changes rarely — `configMap` context is the right-sized tool.
    - id: d
      text: A `preconditions` block listing the allowed values.
      explanation: "`preconditions` gates whether a rule runs at all; it is not a data-storage mechanism for an allow-list."
    correct_option: b
    explanation: '`context[].configMap` loads a ConfigMap''s data into a rule as a variable. Updating the ConfigMap takes effect on the next admission request with no policy edit required — exactly the "change the list without touching every policy" requirement described.'

  - id: ats007-020-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: Use preconditions to limit a rule to some requests
    source_readings:
    - sections/section-020/module-02/course-03-preconditions-and-allow-lists.md
    prompt: A rule includes a `preconditions.all` block requiring `request.operation` to equal `CREATE`, followed by a `mutate` action. On an `UPDATE` request to the same kind of resource, what happens?
    options:
    - id: a
      text: The mutate action still runs, because `preconditions` only affects `validate` rules.
      explanation: "`preconditions` applies uniformly to whichever action the rule performs."
    - id: b
      text: The rule is skipped entirely for this request — no mutation, no violation, no report entry — because the precondition evaluated to false.
      explanation: Correct. `preconditions` gates the entire rule body — `validate`, `mutate`, or `generate` alike. When the condition evaluates to false, the rule is treated as not applicable to this request and is skipped outright, with no side effect and no report entry, which is a distinct outcome from a `validate` rule that ran and failed.
    - id: c
      text: The request is denied, because failing a precondition is treated the same as failing a `validate.pattern`.
      explanation: A failed precondition means "not applicable," not "denied"; only a failed `validate` check produces a denial or audit finding.
    - id: d
      text: Kyverno raises an error because `preconditions` cannot be combined with `mutate` rules.
      explanation: "`preconditions` is commonly paired with `mutate` rules specifically to skip mutation on operations where it would not make sense (e.g. `DELETE`)."
    correct_option: b
    explanation: "`preconditions` gates the entire rule body — `validate`, `mutate`, or `generate` alike. When the condition evaluates to false, the rule is treated as not applicable to this request and is skipped outright, with no side effect and no report entry, which is a distinct outcome from a `validate` rule that ran and failed."

  - id: ats007-020-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: Fail a build when a policy no longer behaves as expected
    source_readings:
    - sections/section-020/module-03/course-03-kyverno-test-suites-and-jp.md
    prompt: Your policy repository contains a rule that is *supposed* to reject Pods without a `team` label. You want a CI job that fails the build if that rule ever stops rejecting them — for example, after someone refactors the `match` block. Which CLI command expresses that requirement, and why is the other one unsuitable?
    options:
    - id: a
      text: "`kyverno apply`, because it exits non-zero whenever a resource fails a policy."
      explanation: 'For this specific requirement: `kyverno apply` treats *any* failure as a bad outcome and exits non-zero. It cannot express "this resource is supposed to fail," so a rule that stopped rejecting anything would make `apply` exit **zero** — the build would pass precisely when the bug appeared.'
    - id: b
      text: "`kyverno test`, because a test suite can assert that a specific resource must *fail* a specific rule, and reports an error when that expected failure stops happening."
      explanation: 'Correct. A `kyverno-test.yaml` suite declares an expected `result` (`pass`, `fail`, `skip`, or `warn`) per resource per rule. Declaring `result: fail` for the unlabelled Pod asserts "this rule must reject this resource" — so if a refactor breaks the `match` block and the rule silently stops firing, the expectation is no longer met and the suite fails. That is exactly the regression signal described.'
    - id: c
      text: "`kubectl apply --dry-run=server`, because only a real admission webhook can confirm a rule still works."
      explanation: Would work only against a live cluster with the policy already applied, which defeats the purpose of gating a pull request before anything is deployed; it also cannot assert an expected failure as a success condition.
    - id: d
      text: Either command works identically; `test` is just an alias for `apply` with prettier output.
      explanation: They are distinct commands with different purposes; `apply` evaluates and reports, `test` asserts against declared expectations.
    correct_option: b
    explanation: 'A `kyverno-test.yaml` suite declares an expected `result` (`pass`, `fail`, `skip`, or `warn`) per resource per rule. Declaring `result: fail` for the unlabelled Pod asserts "this rule must reject this resource" — so if a refactor breaks the `match` block and the rule silently stops firing, the expectation is no longer met and the suite fails. That is exactly the regression signal described.'

  - id: ats007-020-q10
    type: single_choice
    difficulty: advanced
    learning_objective: Write a JMESPath expression that selects matching containers
    source_readings:
    - sections/section-020/module-02/course-01-variables-and-jmespath-basics.md
    prompt: You are writing a rule that needs a JMESPath expression to collect the names of every container in a Pod that is missing a memory limit. Rather than repeatedly editing the policy, applying it, and triggering a request to see what the expression returns, which tool lets you evaluate the expression directly against a manifest?
    options:
    - id: a
      text: "`kyverno apply --policy-report`"
      explanation: "`--policy-report` only changes the output *format* of a policy evaluation; it does not evaluate a bare expression."
    - id: b
      text: "`kyverno jp query -i pod.yaml '<expression>'`"
      explanation: Correct. `kyverno jp query` evaluates a JMESPath expression against a JSON or YAML input file and prints the resolved result immediately. Critically, it uses *Kyverno's* JMESPath implementation, so custom functions and edge-case behaviour match exactly what the expression will do inside a real rule — making it the correct debugging loop for the expression itself.
    - id: c
      text: "`kubectl get pod -o jsonpath='<expression>'`"
      explanation: Uses JSONPath, which is a different query language from JMESPath with different syntax and semantics, and it requires a live cluster and an existing Pod. An expression that works there is not guaranteed to work in a Kyverno rule.
    - id: d
      text: "`kyverno test --file-name jmespath.yaml`"
      explanation: "`kyverno test` runs declarative policy test suites; it has no mode for evaluating a standalone expression, and `--file-name` merely selects which test manifest filename to look for."
    correct_option: b
    explanation: "`kyverno jp query` evaluates a JMESPath expression against a JSON or YAML input file and prints the resolved result immediately. Critically, it uses *Kyverno's* JMESPath implementation, so custom functions and edge-case behaviour match exactly what the expression will do inside a real rule — making it the correct debugging loop for the expression itself."

  - id: ats007-020-q11
    type: single_choice
    difficulty: beginner
    learning_objective: Name the metadata annotations of a policy and what they do
    source_readings:
    - sections/section-020/module-04/course-01-policy-metadata-annotations.md
    prompt: 'A policy has the annotation `policies.kyverno.io/severity: high`. What effect does this have on how the policy runs?'
    options:
    - id: a
      text: It makes the policy block more resources.
      explanation: Severity is a note, not a setting.
    - id: b
      text: It switches the policy to Enforce.
      explanation: Only `validationFailureAction` does that.
    - id: c
      text: No effect on behavior. It is a note that people and tools read to sort and filter.
      explanation: Correct. The `policies.kyverno.io` annotations describe a policy and change nothing about how it runs.
    - id: d
      text: It raises the webhook timeout.
      explanation: The timeout is set by `webhookTimeoutSeconds`.
    correct_option: c
    explanation: The standard `policies.kyverno.io` annotations are notes for people and tools. Only fields under `spec` change behavior.

  - id: ats007-020-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: Build and preview a policy overlay with kubectl
    source_readings:
    - sections/section-020/module-04/course-02-kustomize-overlays-for-policies.md
    prompt: You keep one base policy and an overlay folder `overlays/prod`. Which command shows what the overlay would change in the live cluster, without applying it?
    options:
    - id: a
      text: "`kubectl apply -f overlays/prod`"
      explanation: This sends the raw `kustomization.yaml` and does not preview.
    - id: b
      text: "`kubectl diff -k overlays/prod`"
      explanation: Correct. The diff builds the overlay with Kustomize and compares it with the live objects.
    - id: c
      text: "`kubectl get -k overlays/prod --dry-run`"
      explanation: This is not a valid way to preview a change.
    - id: d
      text: "`kubectl explain overlays/prod`"
      explanation: "`explain` shows a field's schema, not a change."
    correct_option: b
    explanation: "`kubectl diff -k <folder>` builds the overlay and compares it with the cluster. It exits with 1 when there are differences."

  - id: ats007-020-q13
    type: single_choice
    difficulty: advanced
    learning_objective: Write a JSON Patch path for an annotation key that contains a slash
    source_readings:
    - sections/section-020/module-04/course-02-kustomize-overlays-for-policies.md
    prompt: In a Kustomize JSON Patch, how do you write the path to the annotation `policies.kyverno.io/severity`?
    options:
    - id: a
      text: "`/metadata/annotations/policies.kyverno.io/severity`"
      explanation: The slash inside the key would be read as a new level.
    - id: b
      text: "`/metadata/annotations/policies.kyverno.io~1severity`"
      explanation: Correct. In a JSON Pointer, a slash inside a key is written `~1`.
    - id: c
      text: "`/metadata/annotations/policies.kyverno.io\\/severity`"
      explanation: A backslash does not escape a slash in a JSON Pointer.
    - id: d
      text: "`/metadata/annotations['policies.kyverno.io/severity']`"
      explanation: This is not JSON Pointer syntax.
    correct_option: b
    explanation: A JSON Pointer writes a slash inside a key as `~1`, so the key `policies.kyverno.io/severity` becomes `policies.kyverno.io~1severity`.

