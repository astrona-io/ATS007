  - id: module-040
    title: "Section 040: OCI Images"
    description: >
      Close the loop on supply-chain trust: the OCI image format and why a
      digest, not a tag, is the only immutable reference to what actually
      runs, then how Kyverno's verifyImages rule enforces Cosign signatures
      and attestations at admission time and rewrites tags to digests.

