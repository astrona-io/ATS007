  - id: module-030
    title: "Section 030: Admission Controllers"
    description: >
      Understand the Kubernetes admission control model that Kyverno plugs
      into: the mutating-then-validating webhook pipeline every write request
      passes through, how Kyverno manages its own webhook configuration, and
      how Enforce and Audit modes and PolicyReports turn that pipeline into a
      governance tool.

    content:
