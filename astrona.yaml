training:
  id: ATS007
  title: "KCA: Fundamentals of Kyverno"
  description: >
    Training material covering the Fundamentals of Kyverno domain for the
    Kyverno Certified Associate (KCA) learning path, with hands-on labs
    for each competency running on a kind Kubernetes cluster.

  certification:
    name: Kyverno Certified Associate
    code: KCA
    provider: Kyverno Project (CNCF Sandbox)
    domain: Fundamentals of Kyverno
    weight: 100

modules:
  - id: module-010
    title: "Section 010: Kyverno Policies & Rules"
    description: >
      Learn how Kyverno turns policy into ordinary Kubernetes resources:
      the ClusterPolicy and Policy CRDs, how a rule's match/exclude block
      selects targets, and the three core rule actions — validate, mutate,
      and generate — that let a cluster block, rewrite, or spawn resources
      automatically.

    content:
