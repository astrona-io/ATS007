        estimated_duration: 20m
        topic: admission-webhooks
        task_kind: build
        tags: [admission-webhook, webhook-configuration, clusterpolicy, required-labels, enforce-mode, admission-denied]
        learning_goals:
          - Show that Kyverno adds ConfigMaps to its validating webhook when a policy needs them
          - Prove the policy rejects an unlabelled ConfigMap and admits a labelled one
        resources:
          - name: "Kyverno: How Kyverno Works"
            url: https://kyverno.io/docs/introduction/how-kyverno-works/
          - name: "Kubernetes: Dynamic Admission Control"
