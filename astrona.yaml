  - id: module-020
    title: "Section 020: YAML Manifests"
    description: >
      Treat a Kyverno policy as what it really is — a plain Kubernetes
      manifest. Learn the apiVersion/kind/metadata/spec anatomy shared with
      every other Kubernetes object, how to apply and inspect policies with
      kubectl, how variables, context, and JMESPath let a policy read
      live cluster data instead of hardcoding values, and how the Kyverno
      CLI validates policies against manifests with no cluster at all.

