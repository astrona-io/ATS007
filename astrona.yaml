        difficulty: beginner
        estimated_duration: 15m
        topic: manifests
        task_kind: build
        tags: [namespaced-policy, yaml-anatomy, kubectl-apply, validate-pattern, enforce-mode, admission-denied]
        learning_goals:
          - Write a namespaced Policy from scratch that denies LoadBalancer Services
          - Prove a LoadBalancer Service is rejected and a ClusterIP Service is admitted
        resources:
          - name: "Kyverno: ClusterPolicy and Policy overview"
            url: https://kyverno.io/docs/policy-types/cluster-policy/overview/
