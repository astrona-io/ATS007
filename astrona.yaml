        path: sections/section-010/module-02/course.md
      - type: reading
        title: "Pattern Validation & Deny Conditions"
        path: sections/section-010/module-02/course-01-pattern-validation-and-deny-conditions.md
      - type: reading
        title: "foreach & Background Scans"
        path: sections/section-010/module-02/course-02-foreach-and-background-scans.md
      - type: reading
        title: Question
        path: sections/section-010/module-02/labs/lab-01/question.md
      - type: lab
        title: "foreach Validate & Background Scan Lab"
        path: sections/section-010/module-02/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: validate
        task_kind: build
        tags: [clusterpolicy, foreach, resource-limits, background-scan, policyreport, enforce-mode]
        learning_goals:
          - Write a foreach validate rule that checks requests and limits on every container
          - Prove new non-compliant Pods are rejected
          - Find an existing violation in a PolicyReport without changing the workload
        resources:
          - name: "Kyverno: Validate Rules"
            url: https://kyverno.io/docs/policy-types/cluster-policy/validate/
          - name: "Kyverno: Policy Reports"
            url: https://kyverno.io/docs/guides/reports/
      - type: reading
