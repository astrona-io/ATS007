  - id: module-020
    title: "Section 020: YAML Manifests"
    description: >
      Treat a Kyverno policy as what it really is: a plain Kubernetes
      manifest. Learn the apiVersion, kind, metadata and spec anatomy shared
      with every other Kubernetes object, how to apply and inspect policies
      with kubectl, how variables, context and JMESPath let a policy read live
      cluster data, and how the Kyverno command-line tool tests policies
      against manifests with no cluster at all.

