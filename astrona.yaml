# Course manifest for ATS007 - Fundamentals of Kyverno (Kyverno Certified Associate).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes last. The section knowledge check (quiz.md) and the section capstone
# close the section. Playgrounds are not listed: the landing page's
# playground marker shows them. Never list solution.md.
#
# Every `path:` is relative to this file.

training:
  id: ATS007
  title: "KCA: Fundamentals of Kyverno"
  description: >
    Training material covering the Fundamentals of Kyverno domain for the
    Kyverno Certified Associate (KCA) learning path: policies and rules,
    YAML manifests, admission controllers and OCI images. Each module pairs a
    layered reader with an ungraded hands-on playground and a graded practice
    lab on a kind Kubernetes cluster. Each section closes with an integration
    capstone.
    Built and verified against Kyverno v1.19.1 (Helm chart 3.9.1).

  certification:
    name: Kyverno Certified Associate
    code: KCA
    provider: Kyverno Project (CNCF Sandbox)
    domain: Fundamentals of Kyverno
    weight: 100

modules:

  - id: module-010
    title: "Section 010: Kyverno Policies & Rules"
    description: >
      Learn how Kyverno turns policy into ordinary Kubernetes resources:
      the ClusterPolicy and Policy kinds, how a rule's match and exclude blocks
      select targets, and the three core rule actions (validate, mutate and
      generate) that let a cluster block, rewrite or create resources
      automatically.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Kyverno Policy & Rule Anatomy"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "ClusterPolicy vs Policy & Rule Anatomy"
        path: sections/section-010/module-01/course-01-clusterpolicy-vs-policy-and-rule-anatomy.md
      - type: reading
        title: "Match, Exclude & Resource Selection"
        path: sections/section-010/module-01/course-02-match-exclude-and-resource-selection.md
      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "ClusterPolicy Label Enforcement Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 15m
        topic: policies-and-rules
        task_kind: build
        tags: [clusterpolicy, match, exclude, validate-pattern, required-labels, enforce-mode, admission-denied]
        learning_goals:
          - Write a ClusterPolicy that requires a team label on Pods in one namespace
          - Exclude a system namespace from the rule with an exclude block
          - Prove the policy rejects a Pod without the label and admits one with it
        resources:
          - name: "Kyverno: Validate Rules"
            url: https://kyverno.io/docs/policy-types/cluster-policy/validate/
          - name: "Kyverno: Selecting Resources (match and exclude)"
            url: https://kyverno.io/docs/policy-types/cluster-policy/match-exclude/
